<!DOCTYPE html>
<html lang="th" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(${equipment.name})}"></head>
<body>
<header th:replace="~{fragments/navbar :: navbar('equipment')}"></header>
<main id="main-content" class="page-shell">
  <nav class="breadcrumb" aria-label="ตำแหน่งหน้า"><a th:href="@{/equipment}" href="/equipment">อุปกรณ์</a><span aria-hidden="true">/</span><span th:text="${equipment.name}">อุปกรณ์</span></nav>
  <div th:replace="~{fragments/messages :: messages}"></div>
  <div class="split-layout"><section><img class="detail-photo" th:src="@{${ui.equipmentImage(equipment)}}" th:alt="${'ภาพประกอบ ' + equipment.name}" width="1536" height="1024" fetchpriority="high"><p class="photo-caption">ภาพประกอบอุปกรณ์</p></section><section class="card summary-card"><span class="eyebrow">Equipment</span><h1 th:text="${equipment.name}">อุปกรณ์</h1><p class="muted" th:text="${equipment.category}" style="margin-top:12px">หมวดหมู่</p><dl class="info-list" style="margin-top:24px"><div class="summary-row"><dt>จำนวนทั้งหมด</dt><dd><strong th:text="${equipment.totalQuantity}">0</strong> ชิ้น</dd></div><div class="summary-row"><dt>การจอง</dt><dd>เพิ่มพร้อมการจองห้อง</dd></div></dl><div class="notice" style="margin-top:24px">จำนวนอุปกรณ์ที่จองได้ขึ้นอยู่กับช่วงเวลาที่เลือก</div><a class="btn btn-primary btn-block" th:href="@{/rooms}" href="/rooms">เลือกพื้นที่เพื่อจองอุปกรณ์ <span aria-hidden="true">→</span></a><a class="btn btn-text" th:href="@{/equipment}" href="/equipment" style="margin-top:10px">← กลับไปดูอุปกรณ์</a></section></div>
</main>
<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
