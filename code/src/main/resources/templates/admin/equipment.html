<!DOCTYPE html>
<html lang="th" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/head :: head('จัดการอุปกรณ์')}"></head><body class="admin-body"><div class="admin-layout"><aside th:replace="~{fragments/admin-sidebar :: sidebar('equipment')}"></aside><main class="admin-main" id="main-content"><div th:replace="~{fragments/admin-sidebar :: topbar('จัดการอุปกรณ์')}"></div><div th:replace="~{fragments/messages :: messages}"></div><div class="page-heading"><h1>จัดการอุปกรณ์</h1><a class="btn btn-primary" th:href="@{/admin/equipment}">เพิ่มอุปกรณ์</a></div>
<div class="drawer-layout"><section class="card table-wrap"><table class="data-table"><thead><tr><th>ชื่ออุปกรณ์</th><th>หมวดหมู่</th><th>จำนวนทั้งหมด</th><th>จัดการ</th></tr></thead><tbody><tr th:each="equipment : ${equipmentList}"><td><img class="table-thumb" th:src="${ui.equipmentImage(equipment)}" alt="" width="64" height="48"><span th:text="${equipment.name}"></span></td><td th:text="${equipment.category}"></td><td th:text="${equipment.totalQuantity}"></td><td><a class="btn btn-text" th:href="@{/admin/equipment(editId=${equipment.id})}">แก้ไข</a><form th:action="@{/admin/equipment/{id}/delete(id=${equipment.id})}" method="post" data-confirm="ลบอุปกรณ์นี้?"><input th:replace="~{admin/fragments :: csrf}"><button class="btn btn-danger" type="submit">ลบ</button></form></td></tr></tbody></table><p class="empty-state" th:if="${#lists.isEmpty(equipmentList)}">ยังไม่มีอุปกรณ์</p></section>
<section class="card"><h2 th:text="${editId == null ? 'เพิ่มอุปกรณ์' : 'แก้ไขอุปกรณ์'}"></h2><form th:action="${editId == null} ? @{/admin/equipment} : @{/admin/equipment/{id}(id=${editId})}" method="post" enctype="multipart/form-data" th:object="${form}"><input th:replace="~{admin/fragments :: csrf}"><div th:replace="~{admin/fragments :: formErrors}"></div><div class="field"><label for="name">ชื่ออุปกรณ์</label><input id="name" th:field="*{name}" maxlength="100" required><p class="field-error" th:errors="*{name}"></p></div><div class="field"><label for="category">หมวดหมู่</label><input id="category" th:field="*{category}" maxlength="50"></div><div class="field"><label for="totalQuantity">จำนวนทั้งหมด (ชิ้น)</label><input id="totalQuantity" type="number" th:field="*{totalQuantity}" min="0" required><p class="field-error" th:errors="*{totalQuantity}"></p></div><p class="hint">จำนวนในคลังทั้งหมด ยังต้องตรวจจำนวนว่างตามเวลาจอง</p><div class="field"><label for="imageFiles">อัปโหลดรูปจากเครื่อง (เลือกได้หลายไฟล์)</label><input id="imageFiles" name="imageFiles" type="file" multiple accept="image/png,image/jpeg,image/gif,image/webp"><p class="hint" th:text="${'PNG, JPG, GIF หรือ WebP ไฟล์ละไม่เกิน 2 MB รวมได้สูงสุด ' + maxImages + ' รูป รูปแรกจะเป็นรูปปก'}">PNG, JPG, GIF หรือ WebP</p><p class="field-error" th:errors="*{imageFiles}"></p></div><div class="field"><label for="imageUrl">ลิงก์รูป (URL)</label><input id="imageUrl" type="text" inputmode="url" th:field="*{imageUrl}" maxlength="500" placeholder="https://..."><p class="hint">ไม่ใส่ก็ได้ ใช้เมื่อยังไม่มีรูปที่อัปโหลด ถ้าว่างทั้งคู่จะใช้รูปเดิมของระบบ</p><p class="field-error" th:errors="*{imageUrl}"></p><img class="table-thumb" th:if="${form.imageUrl != null and !#strings.isEmpty(#strings.trim(form.imageUrl))}" th:src="${#strings.trim(form.imageUrl)}" alt="ตัวอย่างรูป" width="64" height="48"></div><button class="btn btn-primary" type="submit">บันทึก</button><a class="btn btn-secondary" th:href="@{/admin/equipment}">ยกเลิก</a></form><div class="admin-gallery" th:if="${editId != null}"><h3 th:text="${'อัลบั้มรูป (' + #lists.size(galleryIds) + '/' + maxImages + ')'}">อัลบั้มรูป</h3><p class="hint" th:if="${#lists.isEmpty(galleryIds)}">ยังไม่มีรูปที่อัปโหลด</p><ul class="admin-gallery-list" th:unless="${#lists.isEmpty(galleryIds)}"><li th:each="imageId, s : ${galleryIds}"><img class="table-thumb" th:src="@{/images/{id}(id=${imageId})}" th:alt="${'รูปที่ ' + s.count}" width="74" height="54"><span class="status-pill status-approved" th:if="${s.first}">รูปปก</span><form th:unless="${s.first}" th:action="@{/admin/equipment/{id}/images/{img}/cover(id=${editId},img=${imageId})}" method="post"><input th:replace="~{admin/fragments :: csrf}"><button class="btn btn-text" type="submit">ตั้งเป็นรูปปก</button></form><form th:action="@{/admin/equipment/{id}/images/{img}/delete(id=${editId},img=${imageId})}" method="post" data-confirm="ลบรูปนี้?"><input th:replace="~{admin/fragments :: csrf}"><button class="btn btn-danger" type="submit">ลบ</button></form></li></ul></div></section></div>
</main></div></body></html>
