<!DOCTYPE html>
<html lang="th" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/head :: head('จองแทนผู้ใช้')}"></head><body class="admin-body"><div class="admin-layout">
<aside th:replace="~{fragments/admin-sidebar :: sidebar('bookings')}"></aside><main class="admin-main" id="main-content"><div th:replace="~{fragments/admin-sidebar :: topbar('จองแทนผู้ใช้')}"></div><div th:replace="~{fragments/messages :: messages}"></div><div class="page-heading"><h1>จองแทนผู้ใช้</h1><p>เลือกผู้จอง พื้นที่ เวลา และอุปกรณ์</p></div>
<form class="card" th:action="@{/admin/bookings/new}" method="post" th:object="${form}"><input th:replace="~{admin/fragments :: csrf}"><div th:replace="~{admin/fragments :: formErrors}"></div><div class="form-grid"><div class="field"><label for="userId">ผู้ที่จองให้</label><select id="userId" th:field="*{userId}" required><option value="">เลือกผู้ใช้</option><option th:each="user : ${users}" th:value="${user.id}" th:text="${user.username}"></option></select><p class="field-error" th:errors="*{userId}"></p></div><div class="field"><label for="roomId">ห้อง</label><select id="roomId" th:field="*{roomId}" required><option value="">เลือกห้อง</option><option th:each="room : ${rooms}" th:value="${room.id}" th:text="${room.name + ' · ' + ui.roomTypeLabel(room.roomType) + ' · ' + room.capacity + ' ที่นั่ง'}" th:disabled="${room.status.name() == 'MAINTENANCE'}"></option></select><p class="field-error" th:errors="*{roomId}"></p></div><div class="field"><label for="date">วันที่</label><input id="date" type="date" th:field="*{date}" th:min="${ui.today()}" required><p class="field-error" th:errors="*{date}"></p></div><div class="field"><label for="startTime">เวลาเริ่ม</label><input id="startTime" type="time" th:field="*{startTime}" required><p class="field-error" th:errors="*{startTime}"></p></div><div class="field"><label for="endTime">เวลาสิ้นสุด</label><input id="endTime" type="time" th:field="*{endTime}" required><p class="field-error" th:errors="*{endTime}"></p></div></div><div class="field"><label for="purpose">วัตถุประสงค์ (ไม่บังคับ)</label><textarea id="purpose" th:field="*{purpose}" rows="3" maxlength="255"></textarea></div>
<h2>อุปกรณ์เพิ่มเติม</h2><p>ใส่ 0 หากไม่ต้องการอุปกรณ์นั้น จำนวนที่เลือกยังต้องผ่านการตรวจตามช่วงเวลาจอง</p><div class="form-grid" th:each="item, iteration : *{equipmentItems}"><div class="field"><label th:for="${'equipment-' + iteration.index}">อุปกรณ์</label><select th:id="${'equipment-' + iteration.index}" th:field="*{equipmentItems[__${iteration.index}__].equipmentId}"><option th:each="equipment : ${equipmentList}" th:value="${equipment.id}" th:text="${equipment.name + ' · มีทั้งหมด ' + equipment.totalQuantity}"></option></select></div><div class="field"><label th:for="${'quantity-' + iteration.index}">จำนวน (ชิ้น)</label><input th:id="${'quantity-' + iteration.index}" type="number" min="0" th:field="*{equipmentItems[__${iteration.index}__].quantity}"></div></div>
<p class="notice">ทั้งห้องมาตรฐานและห้อง VIP เริ่มด้วยสถานะรอผู้ดูแลระบบอนุมัติ</p><button class="btn btn-primary" type="submit">สร้างการจอง</button><a class="btn btn-secondary" th:href="@{/admin/bookings}">กลับไปรายการจอง</a></form>
</main></div></body></html>
