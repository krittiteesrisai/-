<!DOCTYPE html>
<html lang="th" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/head :: head('จัดการห้อง')}"></head><body class="admin-body"><div class="admin-layout"><aside th:replace="~{fragments/admin-sidebar :: sidebar('rooms')}"></aside><main class="admin-main" id="main-content"><div th:replace="~{fragments/admin-sidebar :: topbar('จัดการห้อง')}"></div><div th:replace="~{fragments/messages :: messages}"></div><div class="page-heading"><h1>จัดการห้อง</h1><a class="btn btn-primary" th:href="@{/admin/rooms}">เพิ่มห้อง</a></div>
<div class="drawer-layout"><section class="card table-wrap"><table class="data-table"><thead><tr><th>ชื่อห้อง</th><th>ความจุ</th><th>ชั้น / ประเภท</th><th>สถานะ</th><th>จัดการ</th></tr></thead><tbody><tr th:each="room : ${rooms}"><td><img class="table-thumb" th:src="@{${ui.roomImage(room)}}" alt="" width="64" height="48"><span th:text="${room.name}"></span></td><td th:text="${room.capacity + ' ที่นั่ง'}"></td><td><span th:text="${room.floor}"></span><br><span th:text="${ui.roomTypeLabel(room.roomType)}"></span></td><td><span class="status-pill" th:classappend="${ui.statusClass(room.status)}" th:text="${ui.statusLabel(room.status)}"></span></td><td><a class="btn btn-text" th:href="@{/admin/rooms(editId=${room.id})}">แก้ไข</a><form th:action="@{/admin/rooms/{id}/delete(id=${room.id})}" method="post" data-confirm="ลบห้องนี้? ห้องที่มีการจองจะลบไม่ได้"><input th:replace="~{admin/fragments :: csrf}"><button class="btn btn-danger" type="submit">ลบ</button></form></td></tr></tbody></table><p class="empty-state" th:if="${#lists.isEmpty(rooms)}">ยังไม่มีห้อง เพิ่มห้องแรกได้จากฟอร์มด้านข้าง</p></section>
<section class="card"><h2 th:text="${editId == null ? 'เพิ่มห้อง' : 'แก้ไขห้อง'}"></h2><form th:action="${editId == null} ? @{/admin/rooms} : @{/admin/rooms/{id}(id=${editId})}" method="post" th:object="${form}"><input th:replace="~{admin/fragments :: csrf}"><div th:replace="~{admin/fragments :: formErrors}"></div><div class="field"><label for="name">ชื่อห้อง</label><input id="name" th:field="*{name}" maxlength="100" required><p class="field-error" th:errors="*{name}"></p></div><div class="field"><label for="capacity">ความจุ (ที่นั่ง)</label><input id="capacity" type="number" th:field="*{capacity}" min="1" required><p class="field-error" th:errors="*{capacity}"></p></div><div class="field"><label for="floor">ชั้น</label><input id="floor" th:field="*{floor}" maxlength="20"></div><div class="field"><label for="roomType">ประเภทห้อง</label><select id="roomType" th:field="*{roomType}"><option value="STANDARD">มาตรฐาน</option><option value="VIP">VIP</option></select></div><div class="field"><label for="status">สถานะบริการ</label><select id="status" th:field="*{status}"><option value="AVAILABLE">พร้อมให้บริการ</option><option value="MAINTENANCE">ปิดซ่อมบำรุง</option></select><p class="hint">สถานะบริการแยกจากความว่างในช่วงเวลาที่จอง</p></div><div class="field"><label for="imageUrl">ลิงก์รูป (URL)</label><input id="imageUrl" type="url" th:field="*{imageUrl}" maxlength="500" placeholder="https://..."><p class="hint">ไม่ใส่ก็ได้ ถ้าว่างจะใช้รูปเดิมของระบบ</p><p class="field-error" th:errors="*{imageUrl}"></p><img class="table-thumb" th:if="${form.imageUrl != null and !#strings.isEmpty(#strings.trim(form.imageUrl))}" th:src="${#strings.trim(form.imageUrl)}" alt="ตัวอย่างรูป" width="64" height="48"></div><button class="btn btn-primary" type="submit">บันทึก</button><a class="btn btn-secondary" th:href="@{/admin/rooms}">ยกเลิก</a></form></section></div>
</main></div></body></html>
